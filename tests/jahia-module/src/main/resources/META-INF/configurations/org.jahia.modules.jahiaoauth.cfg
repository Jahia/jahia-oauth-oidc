# jahia-oauth refuses a connector endpoint reached over cleartext, and raises
# "Connector endpoint must use https" from JahiaOAuthServiceImpl.requireSecureEndpoint()
# when the callback goes to exchange the authorization code. The whole stack here runs on
# plain HTTP, so without this the eight interactive specs fail at /userinfo even though
# the login itself succeeded.
#
# Turning the guard off is what jahia-oauth itself does in its own test harness, for the
# same reason. It belongs to the test module and never ships to a real deployment: the
# property is read from the org.jahia.modules.jahiaoauth configuration, which this file
# provides only for as long as the test module is installed.
#
# The property is PLURAL here while the Java method is singular — do not "fix" it, or the
# guard silently stays on.
requireSecureEndpoints=false
