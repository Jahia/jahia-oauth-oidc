# Run the Cypress suite on demand against an arbitrary Jahia image.
name: Manual run

on:
  workflow_dispatch:
    inputs:
      jahia_image:
        description: 'Jahia Image'
        required: true
        default: 'ghcr.io/jahia/jahia-ee-dev:8-SNAPSHOT'
      manifest:
        description: 'Provisioning manifest. A file in the tests folder, or a publicly accessible link'
        required: true
        default: 'provisioning-manifest-build.yml'

jobs:
  build:
    name: Build Module
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jahia/jahia-docker-mvn-cache:11-jdk-noble-mvn-loaded
      credentials:
        username: ${{ secrets.GH_PACKAGES_USERNAME }}
        password: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: jahia/jahia-modules-action/build@v2
        with:
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}

  integration-tests-standalone:
    name: Manual run - ${{ github.event.inputs.jahia_image }}
    needs: build
    uses: Jahia/jahia-modules-action/.github/workflows/reusable-integration-tests.yml@v2
    secrets: inherit
    with:
      jahia_image: ${{ github.event.inputs.jahia_image }}
      module_id: jahia-oauth-oidc
      should_skip_testrail: true
      pagerduty_skip_notification: true
      provisioning_manifest: ${{ github.event.inputs.manifest }}
      artifact_prefix: oauth-oidc
      module_branch: ${{ github.ref }}
